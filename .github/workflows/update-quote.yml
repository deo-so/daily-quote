name: Update Daily Quote
on:
  schedule:
    - cron: '38 11 * * *' # Runs at 12:00
  workflow_dispatch:
jobs:
  update-quote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Fetch quote and generate files
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node update-quote.js

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: 'index.html current-quote.json history.json feed.xml screenshots/*'
          commit_message: 'Update daily quote'
